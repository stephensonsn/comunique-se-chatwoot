# Gera a imagem do Chatwoot da IMEP: versão oficial (CE) + patches/.
# PR: só confere (patch encaixa, testes passam, imagem compila). main: publica no GHCR.
name: Imagem Chatwoot IMEP

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  imagem:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Versão
        id: v
        run: |
          VERSAO="$(tr -d '[:space:]' < CHATWOOT_VERSION)"
          echo "versao=$VERSAO" >> "$GITHUB_OUTPUT"
          echo "tag=ghcr.io/${GITHUB_REPOSITORY,,}:${VERSAO}-imep.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "fixa=ghcr.io/${GITHUB_REPOSITORY,,}:${VERSAO}-imep" >> "$GITHUB_OUTPUT"

      - name: Aplicar patches
        run: bash scripts/aplicar.sh chatwoot

      - uses: pnpm/action-setup@v4
        with:
          version: 10.2.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Testes do patch (vitest)
        working-directory: chatwoot
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          npx vitest run app/javascript/dashboard/helper/specs/editorHelper.spec.js \
                         app/javascript/dashboard/helper/specs/editorHelperSignatureImep.spec.js

      - name: Edição CE (igual ao publish_foss_docker oficial)
        working-directory: chatwoot
        run: |
          rm -rf enterprise spec/enterprise node_modules
          echo -en '\nENV CW_EDITION="ce"' >> docker/Dockerfile

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (e publicação no main)
        uses: docker/build-push-action@v6
        with:
          context: chatwoot
          file: chatwoot/docker/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.v.outputs.tag }}
            ${{ steps.v.outputs.fixa }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
