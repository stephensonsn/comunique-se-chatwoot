# Gera a imagem do Chatwoot da IMEP: versão oficial (CE) + patches/.
# PR: só confere (patch encaixa, testes passam, imagem compila). main: publica no GHCR.
name: Imagem Chatwoot IMEP

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # RSpec das partes tocadas pelos patches (igual ao run_foss_spec oficial, só os arquivos do WhatsApp).
  rspec:
    # 24.04: o ubuntu-26.04 só tem o Ruby 3.4 mais novo pronto, e o Gemfile pede o 3.4.4
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ''
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --entrypoint redis-server
    env:
      RAILS_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_USERNAME: postgres
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar patches
        run: bash scripts/aplicar.sh chatwoot

      - name: Edição CE
        working-directory: chatwoot
        run: rm -rf enterprise spec/enterprise

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: chatwoot
          bundler-cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10.2.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Banco de teste
        working-directory: chatwoot
        run: |
          cp .env.example .env
          pnpm install --frozen-lockfile --ignore-scripts
          bundle exec rake db:create
          bundle exec rake db:schema:load

      - name: RSpec do WhatsApp (histórico em coexistência)
        working-directory: chatwoot
        run: |
          bundle exec rspec \
            spec/services/whatsapp/history_sync \
            spec/services/whatsapp/embedded_signup_service_spec.rb \
            spec/services/whatsapp/reauthorization_service_spec.rb \
            spec/services/whatsapp/webhook_setup_service_spec.rb \
            spec/services/whatsapp/facebook_api_client_spec.rb \
            spec/services/whatsapp/message_dedup_lock_spec.rb \
            spec/jobs/webhooks/whatsapp_events_job_spec.rb

  imagem:
    needs: rspec
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Versão
        id: v
        run: |
          VERSAO="$(tr -d '[:space:]' < CHATWOOT_VERSION)"
          echo "versao=$VERSAO" >> "$GITHUB_OUTPUT"
          echo "tag=ghcr.io/${GITHUB_REPOSITORY,,}:${VERSAO}-imep.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "fixa=ghcr.io/${GITHUB_REPOSITORY,,}:${VERSAO}-imep" >> "$GITHUB_OUTPUT"

      - name: Aplicar patches
        run: bash scripts/aplicar.sh chatwoot

      - uses: pnpm/action-setup@v4
        with:
          version: 10.2.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Testes do patch (vitest)
        working-directory: chatwoot
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          npx vitest run app/javascript/dashboard/helper/specs/editorHelper.spec.js \
                         app/javascript/dashboard/helper/specs/editorHelperSignatureImep.spec.js

      - name: Edição CE (igual ao publish_foss_docker oficial)
        working-directory: chatwoot
        run: |
          rm -rf enterprise spec/enterprise node_modules
          echo -en '\nENV CW_EDITION="ce"' >> docker/Dockerfile

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (e publicação no main)
        uses: docker/build-push-action@v6
        with:
          context: chatwoot
          file: chatwoot/docker/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.v.outputs.tag }}
            ${{ steps.v.outputs.fixa }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
